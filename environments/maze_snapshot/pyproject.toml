[project]
name = "maze-snapshot"
description = "Is this maze or MazeBench room solvable? Single-turn snapshot judgments with exact 50/50 labels, for Prime Intellect Verifiers."
tags = ["maze", "mazebench", "vision", "spatial-reasoning", "single-turn", "eval"]
version = "0.1.0"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "verifiers==0.3.0",
    "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["maze_snapshot/**/*.py", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["maze_snapshot"]

[tool.hatch.build.targets.wheel.force-include]
# the maze generator, renderer and prompt from the repository root travel inside the wheel
"../../mazes" = "mazes"

[tool.verifiers.eval]
num_examples = 40
rollouts_per_example = 1
