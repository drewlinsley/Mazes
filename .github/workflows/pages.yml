name: Deploy the task site to GitHub Pages

on:
  push:
    branches: [main, claude/maze-solvability-classification-pmyx7b]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the static site (root redirect, the task site, its stimuli, docs)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r web _site/web
          cp -r docs _site/docs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
